<style>
:root{--bg:#080808;--card:#121212;--card2:#191919;--text:#fff;--muted:#9b9b9b;--blue:#ff7a00;--green:#39c779;--orange:#ff7a00;--red:#ff4d4f;--line:#2a211a;--accent:#ff7a00;--accent2:#ff9b2f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}

.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.amount{font-weight:800;font-size:18px}.green{color:var(--green)}.orange{color:var(--orange)}
.fab{position:fixed;right:22px;bottom:104px;width:60px;height:60px;border-radius:50%;border:1px solid #ffac55;background:linear-gradient(145deg,#ff982f,#ff6700);color:white;font-size:34px;box-shadow:0 10px 30px #ff7a0050;z-index:20}

.sectionTitle{font-size:28px;font-weight:800;margin:18px 0 6px}.empty{color:var(--muted);padding:24px 4px;text-align:center}

.overlay{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#121722;border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 22px)}

.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{border:1px solid #3a281a;background:linear-gradient(180deg,#21180f,#17120d);color:white;border-radius:16px;padding:18px 12px;text-align:left;font-weight:800}
.notice{background:#1d2740;border:1px solid #31466f;border-radius:15px;padding:12px;color:#bfd2ff;font-size:13px;margin-top:12px}.topActions{display:flex;gap:10px}.topActions button{flex:1}
.chev{color:var(--muted);font-size:22px}.historyCard{background:#101010;border:1px solid #34251a;border-radius:16px;padding:13px;margin:10px 0}

.dashSplit{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;align-items:stretch;margin-top:12px}

.dashRows{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.dashRow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

.dashVal{font-size:13px;font-weight:850;white-space:nowrap}
.pos{color:#62d99a}.neg{color:#ff6268}.neutral{color:#fff}
.homeWide{position:relative;overflow:hidden}
.homeWide:after{content:"";position:absolute;right:-48px;top:-54px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ff7a001c 0%,transparent 70%);pointer-events:none}

.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sectionTitleMini{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:#ff8a16}
.homeIcon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:#1d130d;border:1px solid #5c3518;box-shadow:0 8px 20px #0007}

.homeWide.money .dashPane.left,.homeWide.supplier .dashPane.left{background:linear-gradient(90deg,rgba(54,193,120,.055),transparent 70%)}
.homeWide.money .dashPane:not(.left),.homeWide.supplier .dashPane:not(.left){background:linear-gradient(270deg,rgba(255,76,84,.055),transparent 70%)}
.homeWide.invest .dashPane.left{background:linear-gradient(90deg,rgba(255,122,0,.055),transparent 70%)}
.homeWide .dashPane{border-radius:14px;padding:10px 10px 10px 0}
.homeWide .dashPane:not(.left){padding-left:2px}
.homeWide .dashLabel{font-size:10px;letter-spacing:.9px}
.homeWide .dashTotal{font-size:28px}
.homeWide .dashRows{gap:7px;margin-top:7px}
.homeWide .dashRow{padding-bottom:2px;border-bottom:1px dashed #241a14}

.pos{color:#6be3a2}.neg{color:#ff6b72}.neutral{color:#fff}
.homeTopHint{font-size:12px;color:#6f655f;margin-top:11px;display:flex;align-items:center;gap:6px}

.agendaCard{margin-top:14px;cursor:pointer}.agendaCard .kicker{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}
.agendaHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.agendaTitle{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}

.agendaGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.agendaCard{border-color:#56331d}.miniTask{min-height:57px}.miniTaskTitle{line-height:1.35}.agendaEmpty{min-height:56px}
.dayCol{min-width:0}
.dayHead{display:flex;align-items:flex-end;gap:8px;margin-bottom:9px}

.dayNum.tomorrow{color:#8b8886}

.agendaEmpty{font-size:12px;color:#706963;padding:8px 2px}
.agendaMore{font-size:12px;color:#ff9a3d;margin-top:4px;font-weight:800}
.taskListCard{background:#101010;border:1px solid #34251a;border-radius:18px;padding:6px 14px;margin:10px 0}

.taskBody{min-width:0;flex:1}
.taskTitle{font-size:16px;font-weight:850;line-height:1.25}

.paymentHistory{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #2e2a23;font-size:12px;color:#b8c3b8}.paymentHistory b{color:#62d99a;white-space:nowrap}.navico{display:flex;justify-content:center;align-items:center;height:28px}.navico svg{width:23px;height:23px}.iconbtn{min-width:54px;width:54px;height:54px;border:1.5px solid #b65a1c;box-shadow:0 0 0 3px #ff7a0010,0 9px 24px #0009}nav button{display:flex;flex-direction:column;align-items:center;justify-content:center}.iconbtn svg{width:29px;height:29px}
.noteSearchWrap{position:relative;margin:12px 0 14px}

.noteSearchIcon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#8d837c;font-size:17px;pointer-events:none}

:root{--bg:#0b0e13;--card:#181e27;--card2:#202633;--text:#f3f5f8;--muted:#a7b1c0;--blue:#70c9f3;--green:#67dca3;--orange:#ff934c;--red:#ff807d;--line:#303947;--accent:#ff934c}
html,body{max-width:100%;overflow-x:hidden}body{padding-bottom:calc(85px + env(safe-area-inset-bottom))}
.safe{padding:calc(env(safe-area-inset-top) + 14px) 13px 18px}
.card,.homeWide,.taskListCard,.saleCard,.paymentCard,.historyCard,.compactDetails{background:#181f29;border:1px solid #313a48;border-radius:15px;box-shadow:none}
.card{padding:13px;margin-top:10px}.homeWide{padding:14px;overflow:visible}.homeWide:after{display:none}.homeStack{gap:10px;margin-top:10px}
.homeWide .kicker{font-size:12px;color:#dce6f0}.homeWide.supplier{border-left:3px solid #ff934c}.homeWide.money{border-left:3px solid #67dca3}.homeWide.invest{border-left:3px solid #ba9df1}

.dashSplit{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.dashTotal,.homeWide .dashTotal{font-size:clamp(18px,5vw,24px);line-height:1.4;white-space:nowrap;overflow-x:auto;max-width:100%}

.dayNum{font-size:30px}.dayName{color:#94d7fa}.dayName.tomorrow{color:#aab9c9}

.miniTaskMeta{white-space:normal;overflow-wrap:anywhere;font-size:11px}.agendaEmpty{min-height:0;padding:8px 2px}
.sectionTitle{font-size:24px;margin:16px 0 10px}.taskTitle{line-height:1.4;overflow-wrap:anywhere}.taskCheck,.taskDelete{min-width:44px;width:44px;height:44px}
.row{gap:8px;border-color:#303947}.grow{min-width:0;overflow-wrap:anywhere}.row b,.sumTitle{white-space:normal;overflow-wrap:anywhere}
.amount{white-space:nowrap;font-size:16px;max-width:100%;overflow-x:auto}
button.primary,.quick{padding:12px 10px;min-height:44px;border-radius:12px;box-shadow:none;font-size:14px}
.quick{background:#27303d;border-color:#455161}.iconbtn{min-width:46px;width:46px;height:46px;border:1px solid #51483c;background:#29262b;border-radius:13px;box-shadow:none}.iconbtn svg{width:25px;height:25px}
nav{grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 3px calc(7px + env(safe-area-inset-bottom));background:#141b26f2;border-color:#303947}

<div id="overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><button class="sheetClose" aria-label="Закрыть" onclick="closeSheet()">×</button><div id="sheetContent"></div></div></div>
<script>
var KEY='vita_iphone_test_demo_v1';
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function initial(){return {projects:[{id:uid(),name:'Личный'},{id:uid(),name:'Драйв Мастер'},{id:uid(),name:'МЁД'}],tasks:[],expenses:[],projectReturns:[],debts:[],debtPayments:[],notes:[],suppliers:[{id:'hitway',name:'HITWAY'}],supplierSales:[],supplierPayments:[]}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(!x)x=initial();if(!x.projectReturns)x.projectReturns=[];if(!Array.isArray(x.debtPayments))x.debtPayments=[];if(!x.suppliers)x.suppliers=[{id:'hitway',name:'HITWAY'}];if(!x.supplierSales)x.supplierSales=[];if(!x.supplierPayments)x.supplierPayments=[];if(!x._supplierPaymentMigrated){x.supplierSales.forEach(function(s){if(s.paid&&Number(s.payAmount||0)>0){x.supplierPayments.push({id:uid(),supplierId:s.supplierId,amount:Number(s.payAmount||0),currency:s.payCurrency||s.saleCurrency||'RUB',date:s.payDate||s.saleDate||new Date().toISOString().slice(0,10),comment:s.payComment||'Перенесено из старой записи',allocations:[{saleId:s.id,amount:Number(s.payAmount||0)}],created:new Date().toISOString()})}});x._supplierPaymentMigrated=true;localStorage.setItem(KEY,JSON.stringify(x))}return x}catch(e){return initial()}}
var data=load();var tab='home';
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function money(v,c){var sym={RUB:'₽',USD:'$',THB:'฿',EUR:'€'}[c]||c;return Number(v||0).toLocaleString('ru-RU')+' '+sym}
function projectName(id){var p=data.projects.find(function(x){return x.id===id});return p?p.name:'Без проекта'}
function fmtDateOnly(v){if(!v)return 'Дата не указана';var d=new Date(v+'T12:00:00');return d.toLocaleDateString('ru-RU')}
function localDateISO(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function todayISO(){return localDateISO(new Date())}
function iconSvg(name){var p={
home:'<path d="m3 10 9-7 9 7v10H3zM9 21v-7h6v7"/>',
tasks:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h7"/>',
expenses:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 11h18M9 16h6"/>',
debts:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',
suppliers:'<path d="M3 9 12 4l9 5v11H3zM3 9l9 5 9-5M12 14v6"/>',
notes:'<path d="M5 3h11l3 3v15H5zM16 3v4h3M8 11h8M8 15h8"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M9.092 4.979L10.187 2.675L13.813 2.675L14.908 4.979L14.908 4.979L17.312 4.124L19.876 6.688L19.021 9.092L19.021 9.092L21.325 10.187L21.325 13.813L19.021 14.908L19.021 14.908L19.876 17.312L17.312 19.876L14.908 19.021L14.908 19.021L13.813 21.325L10.187 21.325L9.092 19.021L9.092 19.021L6.688 19.876L4.124 17.312L4.979 14.908L4.979 14.908L2.675 13.813L2.675 10.187L4.979 9.092L4.979 9.092L4.124 6.688L6.688 4.124L9.092 4.979Z"/>'};
return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[name]||p.home)+'</svg>'}
function nav(){var items=[['home','home','Главная'],['tasks','tasks','Календарь'],['suppliers','suppliers','Поставщики'],['debts','debts','Деньги'],['expenses','expenses','Инвестиции'],['notes','notes','Заметки']];document.getElementById('nav').innerHTML=items.map(function(i){return '<button class="'+(tab===i[0]?'active':'')+'" onclick="goTab(\''+i[0]+'\')"><span class="navico">'+iconSvg(i[1])+'</span>'+i[2]+'</button>'}).join('')}

function goTab(t){tab=t;if(t==='tasks')vitaTaskMode='overview';render()}

function debtPaid(d){return (data.debtPayments||[]).filter(function(p){return p.debtId===d.id}).reduce(function(s,p){return s+Number(p.amount||0)},0)}
function debtRemaining(d){return d.closed?0:Math.max(0,Math.round((Number(d.amount||0)-debtPaid(d))*100)/100)}
function debtPaymentsFor(d){return (data.debtPayments||[]).filter(function(p){return p.debtId===d.id}).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))})}
function homeDebtSummary(){var toMe={},iOwe={};data.debts.filter(function(d){return debtRemaining(d)>0}).forEach(function(d){var c=d.currency||'RUB',a=debtRemaining(d);if(d.direction==='toMe')toMe[c]=(toMe[c]||0)+a;else iOwe[c]=(iOwe[c]||0)+a});return {toMe:toMe,iOwe:iOwe}}
function allExpenseTotals(){var t={};data.expenses.forEach(function(x){var c=x.currency||'RUB';t[c]=(t[c]||0)+Number(x.amount||0)});return t}
function allSupplierNetTotals(){var t={};data.suppliers.forEach(function(s){var z=supplierNetDueTotals(s.id);Object.keys(z).forEach(function(c){t[c]=(t[c]||0)+Number(z[c]||0)})});return t}
function allSupplierAdvanceTotals(){var t={};data.suppliers.forEach(function(s){var z=supplierAdvanceTotals(s.id);Object.keys(z).forEach(function(c){t[c]=(t[c]||0)+Number(z[c]||0)})});return t}
function projectExpenseBreakdown(){return data.projects.map(function(p){var t={};data.expenses.filter(function(x){return x.project===p.id}).forEach(function(x){var c=x.currency||'RUB';t[c]=(t[c]||0)+Number(x.amount||0)});return {name:p.name,totals:t}}).filter(function(x){return Object.keys(x.totals).length})}
function debtPersonBreakdown(dir){var map={};data.debts.filter(function(d){return debtRemaining(d)>0&&d.direction===dir}).forEach(function(d){var name=(d.person||'Без имени').trim(),c=d.currency||'RUB',k=name+'|'+c;if(!map[k])map[k]={name:name,currency:c,amount:0};map[k].amount+=debtRemaining(d)});return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.amount-a.amount})}
function supplierHomeBreakdown(){return data.suppliers.map(function(s){return {name:s.name,due:supplierNetDueTotals(s.id),advance:supplierAdvanceTotals(s.id)}})}
function rowsMoneyHtml(arr,cls){return arr.length?arr.slice(0,4).map(function(x){return '<div class="dashRow"><span class="dashName">'+esc(x.name)+'</span><span class="dashVal '+cls+'">'+money(x.amount,x.currency)+'</span></div>'}).join(''):'<div class="small">Нет</div>'}
function totalsRowsHtml(rows,cls){var out=[];rows.forEach(function(r){Object.keys(r.totals||{}).forEach(function(c){out.push('<div class="dashRow"><span class="dashName">'+esc(r.name)+'</span><span class="dashVal '+cls+'">'+money(r.totals[c],c)+'</span></div>')})});return out.length?out.join(''):'<div class="small">Нет данных</div>'}
function taskProjectClass(x){var n=projectName(x.project).toLowerCase();if(n.indexOf('драйв')>=0)return 'drive';if(n.indexOf('мёд')>=0||n.indexOf('мед')>=0)return 'honey';return 'personal'}
function taskTimeText(x){if(!x.date||String(x.date).length<=10)return 'Без времени';var d=new Date(x.date);if(isNaN(d.getTime()))return esc(x.date);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function taskRow(x){var when='Без даты';if(x.date){var dt=new Date(x.date);when=String(x.date).length<=10?fmtDateOnly(x.date):isNaN(dt.getTime())?esc(x.date):dt.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}return '<div class="taskItem"><button class="taskCheck" aria-label="'+(x.done?'Вернуть задачу':'Выполнить задачу')+'" onclick="toggleTask(\''+x.id+'\')">'+(x.done?'✓':'○')+'</button><div class="taskBody" role="button" tabindex="0" onclick="editTask(\''+x.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \' ){event.preventDefault();editTask(\''+x.id+'\')}"><div class="taskTitle" style="'+(x.done?'text-decoration:line-through;opacity:.55':'')+'">'+esc(x.title)+'</div><div class="taskMeta">'+when+' · Нажмите, чтобы изменить</div><span class="taskProject '+taskProjectClass(x)+'">'+esc(projectName(x.project))+'</span></div><button class="taskDelete" aria-label="Удалить задачу" onclick="delItem(\'tasks\',\''+x.id+'\')">×</button></div>'}
function miniTask(x){return '<div class="miniTask '+taskProjectClass(x)+(x.done?' done':'')+'" onclick="goTab(\'tasks\')"><div class="miniTaskTitle">'+esc(x.title)+'</div><div class="miniTaskMeta">'+taskTimeText(x)+' · '+esc(projectName(x.project))+'</div></div>'}
function datePlusDays(n){var d=new Date();d.setDate(d.getDate()+n);return localDateISO(d)}
function dayLabelDate(iso){var d=new Date(iso+'T12:00:00');return {name:d.toLocaleDateString('ru-RU',{weekday:'long'}).toUpperCase(),num:d.getDate()}}
function agendaDayHtml(iso,isTomorrow){var info=dayLabelDate(iso),xs=data.tasks.filter(function(x){return x.date&&String(x.date).slice(0,10)===iso&&!x.done}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))});var shown=xs.slice(0,3).map(miniTask).join('');return '<div class="dayCol"><div class="dayHead"><div><div class="dayName '+(isTomorrow?'tomorrow':'')+'">'+(isTomorrow?'ЗАВТРА':info.name)+'</div><div class="dayNum '+(isTomorrow?'tomorrow':'')+'">'+info.num+'</div></div></div>'+(shown||'<div class="agendaEmpty">Ничего не запланировано</div>')+(xs.length>3?'<div class="agendaMore">Ещё '+(xs.length-3)+'</div>':'')+'</div>'}
function agendaHome(){return '<div class="homeWide agendaCard" onclick="goTab(&quot;tasks&quot;)"><div class="kicker"><span>Задачи и напоминания</span><span class="arrow">›</span></div><div class="agendaGrid">'+agendaDayHtml(todayISO(),false)+agendaDayHtml(datePlusDays(1),true)+'</div></div>'}

function projectOptionsSelected(selected){return '<option value="">Без проекта</option>'+data.projects.map(function(p){return '<option value="'+p.id+'" '+(p.id===selected?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')}
function expenseForm(projectId){return '<h2>Новый расход</h2><div class="field"><label>Проект</label><select id="f_project">'+projectOptionsSelected(projectId||'')+'</select></div><div class="field"><label>Сумма</label><input id="f_amount" inputmode="decimal"></div><div class="field"><label>Валюта</label><select id="f_currency"><option>RUB</option><option>USD</option><option>THB</option><option>EUR</option></select></div><div class="field"><label>Дата расхода</label><input id="f_expenseDate" type="date" value="'+todayISO()+'"></div><div class="field"><label>Категория</label><select id="f_category"><option>Продукты</option><option>ГСМ</option><option>Доставка</option><option>Рабочим</option><option>Материал</option><option>Оборудование</option><option>Реклама</option><option>Услуги</option><option>Другое</option></select></div><div class="field"><label>Комментарий</label><textarea id="f_comment"></textarea></div><button class="primary" onclick="addExpense()">Сохранить</button>'}
function expenseProjectGroups(){var map={};data.expenses.forEach(function(x){var id=x.project||'';var k=id||'__none__';if(!map[k])map[k]={projectId:id,projectName:projectName(id),count:0,totals:{}};map[k].count++;var c=x.currency||'RUB';map[k].totals[c]=(map[k].totals[c]||0)+Number(x.amount||0)});return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.projectName.localeCompare(b.projectName,'ru')})}
function expenseTotalsHtml(t){return Object.keys(t).map(function(c){return money(t[c],c)}).join('<br>')}
function showExpenseProject(pid){var xs=data.expenses.filter(function(x){return (x.project||'')===pid}).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});var totals={};xs.forEach(function(x){var c=x.currency||'RUB';totals[c]=(totals[c]||0)+Number(x.amount||0)});var rows=xs.map(function(x){return '<div class="saleCard" ontouchstart="swipeStart(event,this)" ontouchend="swipeEnd(event,this)"><button class="swipeDelete" onclick="deleteExpense(\''+x.id+'\',\''+pid+'\')">Удалить</button><div class="saleInner" onclick="editExpense(\''+x.id+'\',\''+pid+'\')"><div class="row"><div class="grow"><b>'+fmtDateOnly((x.date||'').slice(0,10))+'</b><div class="small">'+esc(x.category||'Другое')+'</div></div><div class="amount">'+money(x.amount,x.currency||'RUB')+'</div></div><div class="small">'+esc(x.comment||'')+'</div></div></div>'}).join('');showSheet('<h2>'+esc(projectName(pid))+'</h2><div class="card"><div class="small">Всего вложено</div><div class="amount">'+expenseTotalsHtml(totals)+'</div></div><div class="tapHint">Нажатие — редактирование · свайп влево — удаление</div><h3 class="vitaHeading">История вложений</h3>'+rows+'<div class="quickgrid"><button class="primary" onclick="showSheet(expenseForm(\''+pid+'\'))">+ Добавить расход</button><button class="quick secondary" onclick="showPaybackProject(\''+pid+'\')">Окупаемость</button></div>')}
function deleteExpense(id,pid){if(!confirm('Удалить инвестиционную запись?'))return;data.expenses=data.expenses.filter(function(x){return x.id!==id});localStorage.setItem(KEY,JSON.stringify(data));render();if(data.expenses.some(function(x){return (x.project||'')===pid}))showExpenseProject(pid);else closeSheet()}

function openPaybackPicker(){showSheet('<h2>Окупаемость проекта</h2><div class="card" style="margin-top:0">'+data.projects.map(function(p){return '<div class="row" onclick="showPaybackProject(\''+p.id+'\')"><div class="grow"><b>'+esc(p.name)+'</b></div><span class="chev">›</span></div>'}).join('')+'</div>')}
function totalsFor(arr,projectId){var t={};arr.filter(function(x){return (x.project||'')===projectId}).forEach(function(x){var c=x.currency||'RUB';t[c]=(t[c]||0)+Number(x.amount||0)});return t}
function showPaybackProject(projectId){var exp=totalsFor(data.expenses,projectId),ret=totalsFor(data.projectReturns||[],projectId),cc={};Object.keys(exp).concat(Object.keys(ret)).forEach(function(c){cc[c]=1});var stats=Object.keys(cc).map(function(c){var a=exp[c]||0,b=ret[c]||0,p=a>0?b/a*100:0;return '<div class="historyCard"><b>'+c+'</b><div class="row"><div class="grow small">Вложено</div><div>'+money(a,c)+'</div></div><div class="row"><div class="grow small">Возвращено из прибыли</div><div class="green">'+money(b,c)+'</div></div><div class="row"><div class="grow small">Окупаемость</div><div class="amount">'+p.toFixed(1)+'%</div></div><div class="row"><div class="grow small">'+(b>=a&&a>0?'Сверх вложений':'Осталось вернуть')+'</div><div>'+money(b>=a&&a>0?b-a:Math.max(a-b,0),c)+'</div></div></div>'}).join('')||'<div class="empty">Пока нет данных</div>';showSheet('<h2>'+esc(projectName(projectId))+'</h2><div class="small">Окупаемость проекта</div>'+stats+'<button class="primary" onclick="openReturnForm(\''+projectId+'\')">+ Внести возврат из прибыли</button>')}
function openReturnForm(projectId){showSheet('<h2>Возврат из прибыли</h2><div class="field"><label>Проект</label><select id="f_returnProject">'+projectOptionsSelected(projectId)+'</select></div><div class="field"><label>Сумма</label><input id="f_returnAmount" inputmode="decimal"></div><div class="field"><label>Валюта</label><select id="f_returnCurrency"><option>RUB</option><option>USD</option><option>THB</option><option>EUR</option></select></div><div class="field"><label>Дата</label><input id="f_returnDate" type="date" value="'+todayISO()+'"></div><div class="field"><label>Комментарий</label><textarea id="f_returnComment" placeholder="Например: часть прибыли за октябрь"></textarea></div><button class="primary" onclick="addProjectReturn()">Сохранить</button>')}
function addProjectReturn(){var a=parseFloat(v('f_returnAmount').replace(',','.'))||0,p=v('f_returnProject');if(a<=0||!p){alert('Укажи проект и сумму');return}data.projectReturns.push({id:uid(),project:p,amount:a,currency:v('f_returnCurrency')||'RUB',date:v('f_returnDate')||todayISO(),comment:v('f_returnComment'),created:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(data));render();showPaybackProject(p)}
function editExpense(id,projectId){var x=data.expenses.find(function(e){return e.id===id});if(!x)return;showSheet('<h2>Редактировать инвестицию</h2><div class="field"><label>Сумма</label><input id="e_amount" inputmode="decimal" value="'+x.amount+'"></div><div class="field"><label>Дата</label><input id="e_date" type="date" value="'+((x.date||'').slice(0,10))+'"></div><div class="field"><label>Категория</label><select id="e_category"><option>Продукты</option><option>ГСМ</option><option>Доставка</option><option>Рабочим</option><option>Материал</option><option>Оборудование</option><option>Реклама</option><option>Услуги</option><option>Другое</option></select></div><div class="field"><label>Комментарий</label><textarea id="e_comment">'+esc(x.comment||'')+'</textarea></div><button class="primary" onclick="saveExpenseEdit(\''+id+'\',\''+projectId+'\')">Сохранить изменения</button>');setTimeout(function(){var s=document.getElementById('e_category');if(s)s.value=x.category||'Другое'},0)}
function saveExpenseEdit(id,projectId){var x=data.expenses.find(function(e){return e.id===id});if(!x)return;var a=parseFloat(v('e_amount').replace(',','.'))||0;if(a<=0){alert('Укажи сумму');return}x.amount=a;x.date=v('e_date')||x.date;x.category=v('e_category')||x.category;x.comment=v('e_comment');localStorage.setItem(KEY,JSON.stringify(data));render();showExpenseProject(projectId)}
function editDebt(id,k){var d=data.debts.find(function(x){return x.id===id});if(!d)return;showSheet('<h2>Редактировать долг</h2><div class="small">Погашено: '+money(debtPaid(d),d.currency||'RUB')+'</div><div class="field"><label>Первоначальная сумма</label><input id="d_amount" inputmode="decimal" value="'+d.amount+'"></div><div class="field"><label>Дата</label><input id="d_date" type="date" value="'+(d.debtDate||todayISO())+'"></div><div class="field"><label>Комментарий</label><textarea id="d_comment">'+esc(d.comment||'')+'</textarea></div><button class="primary" onclick="saveDebtEdit(\''+id+'\',\''+k+'\')">Сохранить</button>')}
function saveDebtEdit(id,k){var d=data.debts.find(function(x){return x.id===id});if(!d)return;var a=Number(v('d_amount').replace(',','.'));if(!Number.isFinite(a)||a<=0||Math.round(a*100)/100!==a){alert('Некорректная сумма');return}if(a<debtPaid(d)-0.001){alert('Сумма меньше уже погашенной');return}var paid=debtPaid(d),wasFullyPaid=d.closed&&paid>=Number(d.amount||0)-0.005;d.amount=a;d.debtDate=v('d_date')||d.debtDate;d.comment=v('d_comment');if(wasFullyPaid&&a>paid+0.005)d.closed=false;else if(paid>=a-0.005)d.closed=true;localStorage.setItem(KEY,JSON.stringify(data));render();if(activeDebtGroups().some(function(g){return g.key===decodeURIComponent(k)}))showDebtGroup(k);else closeSheet()}
function groupDebtCandidates(k,currency){var g=activeDebtGroups().find(function(x){return x.key===decodeURIComponent(k)});if(!g)return [];return g.items.filter(function(d){return (d.currency||'RUB')===currency&&debtRemaining(d)>0}).slice().sort(function(a,b){return String(a.debtDate||a.created||'').localeCompare(String(b.debtDate||b.created||''))||String(a.created||'').localeCompare(String(b.created||''))||String(a.id).localeCompare(String(b.id))})}
function openDebtPayment(id,k){var d=data.debts.find(function(x){return x.id===id});if(!d)return;openGroupDebtPayment(k,d.currency||'RUB')}
function openGroupDebtPayment(k,currency){var g=activeDebtGroups().find(function(x){return x.key===decodeURIComponent(k)});if(!g)return;var currencies=Object.keys(g.totals).filter(function(c){return g.totals[c]>0});if(!currencies.length)return;currency=currencies.includes(currency)?currency:currencies[0];var options=currencies.map(function(c){return '<option value="'+c+'"'+(c===currency?' selected':'')+'>'+c+' · '+money(g.totals[c],c)+'</option>'}).join('');showSheet('<h2>Погашение общего долга</h2><div class="small">'+esc(g.person)+' · Сначала закрываются старые долги</div><div class="field"><label>Валюта</label><select id="dp_currency" onchange="refreshGroupDebtPayment(\''+k+'\')">'+options+'</select></div><div class="card"><div class="small">Общий остаток</div><div id="dp_balance" class="amount">'+money(g.totals[currency],currency)+'</div></div><div class="field"><label>Сумма погашения</label><input id="dp_amount" inputmode="decimal" value="'+g.totals[currency]+'" oninput="refreshGroupDebtPayment(\''+k+'\')"></div><div class="field"><label>Дата</label><input id="dp_date" type="date" value="'+todayISO()+'"></div><div class="field"><label>Комментарий</label><textarea id="dp_comment"></textarea></div><div class="card"><div class="small">Распределение платежа</div><div id="dp_preview"></div></div><button class="primary" onclick="saveGroupDebtPayment(\''+k+'\')">Записать погашение</button>');refreshGroupDebtPayment(k)}
function groupDebtPlan(k,currency,amount){var left=Math.round(amount*100),allocations=[];groupDebtCandidates(k,currency).forEach(function(d){var n=Math.min(Math.round(debtRemaining(d)*100),left);if(n>0){allocations.push({debtId:d.id,amount:n/100,original:d.amount,date:d.debtDate||''});left-=n}});return {allocations:allocations,excess:left/100}}
function refreshGroupDebtPayment(k){var c=v('dp_currency')||'RUB',list=groupDebtCandidates(k,c),total=list.reduce(function(s,d){return s+debtRemaining(d)},0),balance=document.getElementById('dp_balance'),preview=document.getElementById('dp_preview');if(balance)balance.textContent=money(total,c);if(!preview)return;var raw=v('dp_amount').trim().replace(',','.'),n=Number(raw);if(!raw||!Number.isFinite(n)||n<=0){preview.innerHTML='<div class="small">Введите сумму</div>';return}var p=groupDebtPlan(k,c,n);preview.innerHTML=p.allocations.map(function(a){return '<div class="paymentHistory"><span>'+fmtDateOnly(a.date)+' · '+money(a.original,c)+'</span><b>'+money(a.amount,c)+'</b></div>'}).join('')+(p.excess>0?'<div class="small neg">Сумма превышает остаток на '+money(p.excess,c)+'</div>':'')}
function saveGroupDebtPayment(k){var c=v('dp_currency')||'RUB',raw=v('dp_amount').trim().replace(',','.'),n=Number(raw),date=v('dp_date');if(!raw||!Number.isFinite(n)||n<=0||Math.round(n*100)/100!==n){alert('Некорректная сумма');return}if(!date){alert('Укажи дату');return}var p=groupDebtPlan(k,c,n);if(p.excess>0.001){alert('Платёж больше общего остатка в '+c);return}if(!p.allocations.length){alert('Нет долгов для погашения');return}var batch=uid(),created=new Date().toISOString(),comment=v('dp_comment');p.allocations.forEach(function(a){data.debtPayments.push({id:uid(),batchId:batch,debtId:a.debtId,amount:a.amount,currency:c,date:date,comment:comment,created:created});var d=data.debts.find(function(x){return x.id===a.debtId});if(d&&debtRemaining(d)<0.005)d.closed=true});localStorage.setItem(KEY,JSON.stringify(data));backToDebt(k)}
function saveDebtPayment(id,k){saveGroupDebtPayment(k)}

function remainingForSale(x){var cur=x.saleCurrency||'RUB';return Math.max(Number(x.saleAmount||0)-paidForSale(x.id,cur),0)}
function fullyPaidSale(x){return remainingForSale(x)<=0.009}
function paymentAllocatedAmount(p){return (p.allocations||[]).reduce(function(s,a){return s+Number(a.amount||0)},0)}
function paymentAdvanceAmount(p){return Math.max(Number(p.amount||0)-paymentAllocatedAmount(p),0)}
function supplierAdvanceAmount(id,currency){return (data.supplierPayments||[]).filter(function(p){return p.supplierId===id&&(p.currency||'RUB')===currency}).reduce(function(s,p){return s+paymentAdvanceAmount(p)},0)}
function supplierAdvanceTotals(id){var z={};(data.supplierPayments||[]).filter(function(p){return p.supplierId===id}).forEach(function(p){var a=paymentAdvanceAmount(p),c=p.currency||'RUB';if(a>0)z[c]=(z[c]||0)+a});return z}
function supplierDueTotals(id){var z={};data.supplierSales.filter(function(x){return x.supplierId===id&&!fullyPaidSale(x)}).forEach(function(x){var c=x.saleCurrency||'RUB';z[c]=(z[c]||0)+remainingForSale(x)});return z}
function supplierNetDueTotals(id){var due=supplierDueTotals(id),adv=supplierAdvanceTotals(id),z={};Object.keys(due).forEach(function(c){var n=Math.max((due[c]||0)-(adv[c]||0),0);if(n>0)z[c]=n});return z}
function supplierCreditAfterDueTotals(id){var due=supplierDueTotals(id),adv=supplierAdvanceTotals(id),z={};Object.keys(adv).forEach(function(c){var n=Math.max((adv[c]||0)-(due[c]||0),0);if(n>0)z[c]=n});return z}
function paymentsForSupplier(id){return (data.supplierPayments||[]).filter(function(p){return p.supplierId===id}).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))})}
function paidForSale(saleId,currency){var n=0;(data.supplierPayments||[]).forEach(function(p){(p.allocations||[]).forEach(function(a){if(a.saleId===saleId&&(p.currency||currency)===(currency||p.currency))n+=Number(a.amount||0)})});return n}
function paymentAllocText(p){var parts=(p.allocations||[]).map(function(a){var s=data.supplierSales.find(function(x){return x.id===a.saleId});return (s?esc(s.product)+' · '+fmtDateOnly(s.saleDate):'Продажа удалена')+' — '+money(a.amount,p.currency||'RUB')});var adv=paymentAdvanceAmount(p);if(adv>0)parts.push('<b style="color:#61dca1">Аванс у поставщика: '+money(adv,p.currency||'RUB')+'</b>');return parts.join('<br>')}
function deleteSupplierSale(id,supplierId){var sale=data.supplierSales.find(function(x){return x.id===id&&x.supplierId===supplierId});if(!sale)return;var linked=(data.supplierPayments||[]).some(function(p){return (p.allocations||[]).some(function(a){return a.saleId===id&&Number(a.amount||0)>0})});if(linked){alert('Эта продажа уже имеет оплаты. Сначала проверь и удали связанные оплаты в истории поставщика. Продажа и деньги не изменены.');return}if(!confirm('Удалить неоплаченную продажу?'))return;data.supplierSales=data.supplierSales.filter(function(x){return x.id!==id});localStorage.setItem(KEY,JSON.stringify(data));render();showSupplier(supplierId)}
function deleteSupplierPayment(id,supplierId){var p=(data.supplierPayments||[]).find(function(x){return x.id===id&&x.supplierId===supplierId});if(!p)return;var allocated=paymentAllocatedAmount(p),msg=allocated>0?'Удалить оплату '+money(p.amount,p.currency||'RUB')+'?\nИз них '+money(allocated,p.currency||'RUB')+' распределено по товарам. Их остатки к оплате увеличатся.':'Удалить аванс '+money(p.amount,p.currency||'RUB')+'?';if(!confirm(msg))return;data.supplierPayments=(data.supplierPayments||[]).filter(function(x){return x.id!==id});localStorage.setItem(KEY,JSON.stringify(data));render();showSupplier(supplierId)}
var swipeStartX=0,swipeEl=null;
function swipeStart(e,el){swipeStartX=e.touches[0].clientX;swipeEl=el}
function swipeEnd(e,el){if(!swipeEl)return;var dx=e.changedTouches[0].clientX-swipeStartX;document.querySelectorAll('.saleCard.swiped').forEach(function(x){if(x!==el)x.classList.remove('swiped')});if(dx<-35)el.classList.add('swiped');else if(dx>25)el.classList.remove('swiped');swipeEl=null}
function supplierName(id){var s=data.suppliers.find(function(x){return x.id===id});return s?s.name:'Поставщик'}
function supplierOptions(selected){return data.suppliers.map(function(s){return '<option value="'+s.id+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>'}).join('')}

function vitaMoneyValue(raw){var s=String(raw===undefined?'':raw).trim().replace(',','.');if(!/^\d+(?:\.\d{1,2})?$/.test(s))return NaN;var n=Number(s);return Number.isFinite(n)&&n>0&&n<=1000000000000?n:NaN}

   return Array.isArray(a)&&a.length<=10000&&a.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.id==='string'&&x.id.length>0&&Array.isArray(x.ops)&&x.ops.every(o=>o&&typeof o.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||''))&&Number.isFinite(Number(o.amount))));
 }
 window.exportData=function(){
   let savings;
   try{savings=JSON.parse(localStorage.getItem(SAV)||'[]')}catch{alert('Ошибка чтения сбережений. Копия не создана.');return}
   if(!isAccounts(savings)){alert('Ошибка проверки сбережений. Копия не создана.');return}
   const bundle={kind:'vita-test-complete-demo-backup',version:1,createdAt:new Date().toISOString(),main:JSON.parse(JSON.stringify(data)),savings:savings};
   const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
   const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vita-test-complete-demo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 };
 function validBundle(x){
   return x&&x.kind==='vita-test-complete-demo-backup'&&x.version===1&&validateVitaBackup(x.main)&&isAccounts(x.savings)&&Object.keys(x).every(k=>['kind','version','createdAt','main','savings'].includes(k));
 }
 window.importData=function(inp){
   const file=inp.files&&inp.files[0];if(!file)return;
   if(file.size>15000000){alert('Слишком большой файл');inp.value='';return}
   const reader=new FileReader();
   reader.onload=function(){
     try{
       const parsed=JSON.parse(reader.result);
       if(!validBundle(parsed)){alert('Можно восстановить только полную резервную копию Vita Test. Рабочие копии Vita заблокированы.');return}
       const oldMain=localStorage.getItem(DEMO),oldSav=localStorage.getItem(SAV);
       const msg='ВОССТАНОВЛЕНИЕ ТЕСТОВОЙ КОПИИ\n\nЗадач: '+parsed.main.tasks.length+'; долгов: '+parsed.main.debts.length+'; вкладов: '+parsed.savings.length+'.\n\nТекущие тестовые данные будут заменены. Продолжить?';
       if(!confirm(msg)||!confirm('Последнее подтверждение: заменить данные Vita Test?'))return;
       try{localStorage.setItem(DEMO,JSON.stringify(parsed.main));localStorage.setItem(SAV,JSON.stringify(parsed.savings));data=load();closeSheet();render();alert('Тестовая копия восстановлена. Проверь разделы и сбережения.')}
       catch(err){try{if(oldMain===null)localStorage.removeItem(DEMO);else localStorage.setItem(DEMO,oldMain);if(oldSav===null)localStorage.removeItem(SAV);else localStorage.setItem(SAV,oldSav);data=load();render()}catch(e){}alert('Ошибка восстановления; выполнена попытка отката. Проверь данные.')}
     }catch(e){alert('Файл не читается или повреждён. Данные не изменены.')}
     finally{inp.value=''}
   };
   reader.onerror=function(){alert('Ошибка чтения файла');inp.value=''};
   reader.readAsText(file);
 };
})();

window.vitaPushSubscribe=async function(){
 const a=session();
 if(!a){status('Сначала выполни вход в Vita Test.');return}
 if(!('PushManager' in window)||!('Notification' in window)||!('serviceWorker' in navigator)){status('Web Push недоступен. Запусти Vita Test с экрана Домой iPhone.');return}
 try{
  status('Регистрирую iPhone…');
  if(Notification.permission!=='granted'&&(await Notification.requestPermission())!=='granted')throw Error('Нет разрешения на уведомления');
  const reg=await vitaNotifyWorker();
  const key=vitaVapidBytes(VITA_VAPID_PUBLIC);
  let sub=await reg.pushManager.getSubscription();
  if(sub&&sub.options.applicationServerKey){
   const k=new Uint8Array(sub.options.applicationServerKey);
   if(k.length!==key.length||k.some((v,i)=>v!==key[i])){await sub.unsubscribe();sub=null}
  }
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  const obj=sub.toJSON();
  if(!obj.endpoint||!obj.keys?.p256dh||!obj.keys?.auth)throw Error('iPhone не предоставил ключи подписки');
  const h={apikey:KEY,Authorization:'Bearer '+a.access_token};
  const me=await fetch(BASE+'/auth/v1/user',{headers:h});
  if(!me.ok)throw Error('Сеанс входа истёк: войди заново');
  const user=await me.json();
  const saved=await fetch(BASE+'/rest/v1/vita_push_subscriptions',{method:'POST',headers:{...h,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({user_id:user.id,endpoint:obj.endpoint,p256dh:obj.keys.p256dh,auth_secret:obj.keys.auth})});
  if(!saved.ok)throw Error('Сервер отказал: '+saved.status);
  status('✅ iPhone зарегистрирован для Web Push. Автоматическую отправку по расписанию ещё подключаем.');
 }catch(e){status('Ошибка Web Push: '+e.message)}
};

window.vitaTestServerConnection=async function(){

 status('Проверяю безопасный доступ к тестовому серверу…');
 const headers={'apikey':KEY,'Authorization':'Bearer '+a.access_token,'Content-Type':'application/json'};
 let created=null;
 try{
  const me=await fetch(BASE+'/auth/v1/user',{headers});
  if(!me.ok)throw Error('Сеанс истёк. Выполни вход заново.');
  const user=await me.json();
  if(!user.id)throw Error('Не удалось подтвердить пользователя');
  const id='vita-connection-check-'+Date.now();
  const due=new Date(Date.now()+3600000).toISOString();

  if(!post.ok)throw Error('Запись теста: '+post.status+' '+(await post.text()).slice(0,130));
  const rows=await post.json();created=rows[0]?.id;if(!created)throw Error('Сервер не подтвердил запись');

 finally{

 }
